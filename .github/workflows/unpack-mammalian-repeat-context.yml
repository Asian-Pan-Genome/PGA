name: Unpack mammalian repeat-context scripts

# Temporary import workflow; it deletes itself after restoring the scripts.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-mammalian-repeat-context.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore repeat-context scripts
        shell: bash
        run: |
          cat > /tmp/repeat_context.tar.xz.b64 <<'ARCHIVE'

ARCHIVE
          base64 -d /tmp/repeat_context.tar.xz.b64 > /tmp/repeat_context.tar.xz
          mkdir -p mammalian_evolution
          tar -xJf /tmp/repeat_context.tar.xz -C mammalian_evolution
          rm -f .github/workflows/unpack-mammalian-repeat-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mammalian_evolution/repeat_context .github/workflows/unpack-mammalian-repeat-context.yml
          git commit -m 'Add mammalian repeat-context analysis scripts'
          git push
